<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>家族予定回答フォーム</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body{font-family:sans-serif;margin:0;padding:12px;background:#f7f7f7;font-size:16px;}
.date-block{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.date-block.locked{opacity:0.5;}
h2{margin:0 0 8px;font-size:19px;}
.field{margin-bottom:10px;}
.label{font-weight:bold;font-size:16px;margin-bottom:4px;}
.hint{font-weight:normal;font-size:13px;color:#888;}
.options{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.opt{font-size:17px;display:flex;align-items:center;gap:4px;}
input[type="text"],input[type="time"]{padding:8px;box-sizing:border-box;font-size:16px;}
input[type="text"]{width:100%;}
.lockNotice{color:#c0392b;font-size:13px;font-weight:bold;margin-bottom:8px;}
#submitBtn{width:100%;padding:14px;font-size:18px;background:#06c755;color:#fff;border:none;border-radius:8px;margin-top:8px;}
#submitBtn:disabled{background:#aaa;}
</style>
</head>
<body>
<div id="form"></div>
<button id="submitBtn" onclick="submitAnswers()">回答を送信する</button>

<script>
var LIFF_ID = '2010924242-neJCBkBN';

var CATEGORY_DEFS = {
  '車': {
    questionText: '車を使いますか？',
    options: [
      { label: '赤', value: 'はい(赤)' },
      { label: '橙', value: 'はい(オレンジ)' },
      { label: '赤・橙', value: 'はい(赤・オレンジどちらでも可)' }
    ]
  },
  '予定': {
    questionText: '予定を教えてください',
    options: [
      { label: '出社', value: '出社' },
      { label: '学校', value: '学校' },
      { label: 'バイト', value: 'バイト' },
      { label: '在宅', value: '在宅' },
      { label: 'その他', value: 'その他' }
    ]
  },
  '昼食': {
    questionText: 'お昼ご飯はどうしますか？',
    options: [
      { label: '家', value: '家' },
      { label: '弁当', value: '弁当' },
      { label: 'レスト', value: 'レスト' },
      { label: '不要', value: '不要' }
    ]
  },
  '夕食': {
    questionText: '夜ご飯はどうしますか？',
    options: [
      { label: '一緒', value: '一緒に食べる' },
      { label: '個別', value: '遅いので個別に食べる' },
      { label: '不要', value: '不要' }
    ]
  }
};

function tokyoTodayParts() {
  var fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' });
  var parts = fmt.formatToParts(new Date());
  var obj = {};
  parts.forEach(function (p) { if (p.type !== 'literal') obj[p.type] = p.value; });
  return { y: Number(obj.year), m: Number(obj.month), d: Number(obj.day) };
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function formatDateKey(dt) {
  return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth() + 1) + '-' + pad2(dt.getUTCDate());
}

function formatDateLabel(dateKey) {
  var p = dateKey.split('-');
  var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
  var wdNames = ['日', '月', '火', '水', '木', '金', '土'];
  var dow = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  return m + '/' + d + '(' + wdNames[dow] + ')';
}

function targetDates() {
  var today = tokyoTodayParts();
  var base = Date.UTC(today.y, today.m - 1, today.d);
  var keys = [];
  for (var i = 1; i <= 4; i++) {
    keys.push(formatDateKey(new Date(base + i * 86400000)));
  }
  return keys;
}

// 現在のAsia/Tokyo時刻(日付+時+分)を取得する
function tokyoNowInfo() {
  var fmt = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  var parts = fmt.formatToParts(new Date());
  var obj = {};
  parts.forEach(function (p) { if (p.type !== 'literal') obj[p.type] = p.value; });
  var hour = obj.hour === '24' ? 0 : Number(obj.hour);
  return { dateKey: obj.year + '-' + obj.month + '-' + obj.day, hour: hour, minute: Number(obj.minute) };
}

// dateKey(yyyy-MM-dd)に対して days日を加算した日付キーを返す
function addDaysToKey(dateKey, days) {
  var p = dateKey.split('-');
  var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
  var dt = new Date(Date.UTC(y, m - 1, d) + days * 86400000);
  return formatDateKey(dt);
}

// dateKeyの回答は、前日21:00のsendSummary()に間に合わせるため前日20:30が締切
function isLocked(dateKey) {
  var now = tokyoNowInfo();
  var lockDateKey = addDaysToKey(dateKey, -1);
  if (now.dateKey > lockDateKey) return true;
  if (now.dateKey === lockDateKey && (now.hour > 20 || (now.hour === 20 && now.minute >= 30))) return true;
  return false;
}

var DATE_KEYS = targetDates();
var CATEGORIES = Object.keys(CATEGORY_DEFS);

function renderForm() {
  var html = '';
  DATE_KEYS.forEach(function (dateKey) {
    var label = formatDateLabel(dateKey);

    var baitoBlock =
      '<div class="field" id="baito_' + dateKey + '" style="display:none;">' +
      '<div class="label">バイト①</div>' +
      '<div class="options">開始 <input type="time" id="' + dateKey + '_baito1Start"> 終了 <input type="time" id="' + dateKey + '_baito1End"></div>' +
      '<div class="label">バイト②<span class="hint">（ない場合は空欄でよい）</span></div>' +
      '<div class="options">開始 <input type="time" id="' + dateKey + '_baito2Start"> 終了 <input type="time" id="' + dateKey + '_baito2End"></div>' +
      '</div>';

    var otherBlock =
      '<div class="field" id="otherDetail_' + dateKey + '" style="display:none;">' +
      '<div class="label">予定の詳細</div>' +
      '<input type="text" id="' + dateKey + '_scheduleOther" placeholder="具体的な予定を入力">' +
      '</div>';

    var lunchHomeBlock =
      '<div class="field" id="lunchHome_' + dateKey + '" style="display:none;">' +
      '<div class="label">タイミングは？</div><div class="options">' +
      '<label class="opt"><input type="radio" name="' + dateKey + '_昼食詳細" value="早い"> 早い</label>' +
      '<label class="opt"><input type="radio" name="' + dateKey + '_昼食詳細" value="共食"> 共食</label>' +
      '<label class="opt"><input type="radio" name="' + dateKey + '_昼食詳細" value="遅い"> 遅い</label>' +
      '</div></div>';

    var categoryBlocks = '';
    CATEGORIES.forEach(function (category) {
      var def = CATEGORY_DEFS[category];
      var groupName = dateKey + '_' + category;
      categoryBlocks += '<div class="field"><div class="label">' + def.questionText + '</div><div class="options">';
      def.options.forEach(function (o, idx) {
        var id = groupName + '_' + idx;
        var onchange = '';
        if (category === '予定') onchange = ' onchange="onScheduleChange(\'' + dateKey + '\', this.value)"';
        else if (category === '昼食') onchange = ' onchange="onLunchChange(\'' + dateKey + '\', this.value)"';
        categoryBlocks += '<label class="opt"><input type="radio" name="' + groupName + '" value="' + o.value + '" id="' + id + '"' + onchange + '> ' + o.label + '</label>';
      });
      categoryBlocks += '</div></div>';
      if (category === '予定') categoryBlocks += baitoBlock + otherBlock;
      if (category === '昼食') categoryBlocks += lunchHomeBlock;
    });

    var pickupBlock =
      '<div class="field">' +
      '<div class="label">送迎の有無</div>' +
      '<div class="options">' +
      '<label class="opt"><input type="checkbox" id="' + dateKey + '_dropoffCheck" onchange="onPickupToggle(\'' + dateKey + '\', \'dropoff\', this.checked)"> 送り</label>' +
      '<label class="opt"><input type="checkbox" id="' + dateKey + '_pickupCheck" onchange="onPickupToggle(\'' + dateKey + '\', \'pickup\', this.checked)"> 迎え</label>' +
      '</div>' +
      '<div class="options" id="' + dateKey + '_dropoffTimeWrap" style="display:none;">送り時刻 <input type="time" id="' + dateKey + '_dropoffTimeInput"></div>' +
      '<div class="options" id="' + dateKey + '_pickupTimeWrap" style="display:none;">迎え時刻 <input type="time" id="' + dateKey + '_pickupTimeInput"></div>' +
      '</div>';

    html += '<section class="date-block" id="dateBlock_' + dateKey + '"><h2>' + label + '</h2>' +
      categoryBlocks + pickupBlock + '</section>';
  });
  document.getElementById('form').innerHTML = html;
}

function onScheduleChange(dateKey, value) {
  document.getElementById('baito_' + dateKey).style.display = (value === 'バイト') ? 'block' : 'none';
  document.getElementById('otherDetail_' + dateKey).style.display = (value === 'その他') ? 'block' : 'none';
}

function onLunchChange(dateKey, value) {
  document.getElementById('lunchHome_' + dateKey).style.display = (value === '家') ? 'block' : 'none';
}

function onPickupToggle(dateKey, kind, checked) {
  document.getElementById(dateKey + '_' + kind + 'TimeWrap').style.display = checked ? 'block' : 'none';
}

function selectedValue(name) {
  var els = document.getElementsByName(name);
  for (var i = 0; i < els.length; i++) { if (els[i].checked) return els[i].value; }
  return '';
}

function sanitizeText(s) {
  return (s || '').replace(/[|\n\r]/g, ' ').trim();
}

// 前日20:30の締切を過ぎた日付ブロックの入力を無効化し、注意書きを表示する
function applyLocks() {
  DATE_KEYS.forEach(function (dateKey) {
    if (!isLocked(dateKey)) return;
    var block = document.getElementById('dateBlock_' + dateKey);
    if (!block || block.classList.contains('locked')) return;
    block.classList.add('locked');
    var inputs = block.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) { inputs[i].disabled = true; }
    var notice = document.createElement('div');
    notice.className = 'lockNotice';
    notice.textContent = '回答受付は終了しました（前日20:30の締切を過ぎました）';
    block.insertBefore(notice, block.children[1]);
  });
}

function submitAnswers() {
  var lines = [];
  DATE_KEYS.forEach(function (dateKey) {
    if (isLocked(dateKey)) return;
    var parts = [];
    CATEGORIES.forEach(function (cat) {
      var v = selectedValue(dateKey + '_' + cat);
      if (v) parts.push(cat + ':' + v);
      if (cat === '予定' && v === 'バイト') {
        var s1 = document.getElementById(dateKey + '_baito1Start').value;
        var e1 = document.getElementById(dateKey + '_baito1End').value;
        var s2 = document.getElementById(dateKey + '_baito2Start').value;
        var e2 = document.getElementById(dateKey + '_baito2End').value;
        if (s1) parts.push('バイト1開始:' + s1);
        if (e1) parts.push('バイト1終了:' + e1);
        if (s2) parts.push('バイト2開始:' + s2);
        if (e2) parts.push('バイト2終了:' + e2);
      }
      if (cat === '予定' && v === 'その他') {
        var detail = sanitizeText(document.getElementById(dateKey + '_scheduleOther').value);
        if (detail) parts.push('予定詳細:' + detail);
      }
      if (cat === '昼食' && v === '家') {
        var lunchDetail = selectedValue(dateKey + '_昼食詳細');
        if (lunchDetail) parts.push('昼食詳細:' + lunchDetail);
      }
    });
    var dropoffCheck = document.getElementById(dateKey + '_dropoffCheck');
    var pickupCheck = document.getElementById(dateKey + '_pickupCheck');
    if (dropoffCheck && dropoffCheck.checked) {
      var dt = document.getElementById(dateKey + '_dropoffTimeInput').value;
      if (dt) parts.push('送り:' + dt);
    }
    if (pickupCheck && pickupCheck.checked) {
      var pt = document.getElementById(dateKey + '_pickupTimeInput').value;
      if (pt) parts.push('迎え:' + pt);
    }
    if (parts.length > 0) lines.push('ANSWER|' + dateKey + '|' + parts.join('|'));
  });
  if (lines.length === 0) { alert('少なくとも1つ選択してください'); return; }
  var text = lines.join('\n');
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerText = '送信中...';
  liff.sendMessages([{ type: 'text', text: text }]).then(function () {
    liff.closeWindow();
  }).catch(function (err) {
    alert('送信に失敗しました: ' + err);
    btn.disabled = false;
    btn.innerText = '回答を送信する';
  });
}

renderForm();
applyLocks();
setInterval(applyLocks, 60000);

liff.init({ liffId: LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) { liff.login(); }
}).catch(function (err) {
  alert('LIFF初期化に失敗しました: ' + err);
});
</script>
</body>
</html>
